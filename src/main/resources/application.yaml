server:
  port: ${APP_PORT:8080}

spring:
  config:
    import: optional:file:.env
  application:
    name: insurance-api

  # ── Base de datos ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insurance_db}
    username: ${DB_USER:insurance_user}
    password: ${DB_PASSWORD:insurance_pass}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway maneja el schema; Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Kafka ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                  # garantía de entrega
    consumer:
      group-id: insurance-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ── Kafka Topics (autocreación en dev) ──
app:
  kafka:
    topics:
      policy-issued: ${KAFKA_TOPIC_ISSUED:policy.issued}
      policy-activated: ${KAFKA_TOPIC_ACTIVATED:policy.activated}
      policy-suspended: ${KAFKA_TOPIC_SUSPENDED:policy.suspended}
      policy-reactivated: ${KAFKA_TOPIC_REACTIVATED:policy.reactivated}
      policy-cancelled: ${KAFKA_TOPIC_CANCELLED:policy.cancelled}

# ── Swagger / OpenAPI ──
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api/docs
    tags-sorter: alpha
    operations-sorter: alpha

# ── Logging ──
logging:
  level:
    com.insurance: DEBUG
    org.flywaydb: INFO